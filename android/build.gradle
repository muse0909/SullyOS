// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        // 暮色 2026-08-26 角色查手机 P0：PhoneUsagePlugin 是 Kotlin 写的，要 Kotlin 插件
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // 麦麦 2026-09-15：拾光机 主动消息 2.0 后台推送 — UnifiedPush Android 桥接
        //   com.github.UnifiedPush:android-connector 3.0.0 通过 JitPack 分发
        //   https://jitpack.io/#UnifiedPush/android-connector
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
