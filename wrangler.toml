## 主动消息 2.0 · Cloudflare Worker 部署配置
##
## 暮色 8-6 部署流程：
##   1. Cloudflare 仪表盘 Workers & Pages → Create Worker → sullyos
##      - Production branch: preview（暮色 push preview 才会触发 deploy）
##      - Builds for non-production branches: Enabled
##      - Root directory: /
##      - Build command: npm run build:worker:amsg
##      - Deploy command: npx wrangler deploy
##   2. Cloudflare 仪表盘 → Storage & databases → D1 → Create database
##      - name 填 sully-amsg2 → 拿到 database_id（UUID 格式）
##   3. sullyos 主页 → Bindings → Add → D1 database binding
##      - Variable name: DB
##      - D1 database: 选 sully-amsg2
##      Cloudflare 仪表盘会自动把 database_id 同步到下面这个 wrangler.toml
##      （**不要手填下面的 database_id 占位**）
##   4. sullyos 主页 → Settings → Build → Variables and secrets
##      - 加 4 个 Secret：MASTER_KEY / VAPID_EMAIL / VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY
##        VAPID 密钥对去 vapidkeys.com 生成
##   5. Deployments → Retry build
##   6. 拿到 worker URL（https://sullyos.<account>.workers.dev）→
##      前端 Settings → 主动消息 2.0 → API base URL 填这个
##
## 注意：
##   - 不要加 nodejs_compat flag（amsg-server/cloudflare 子路径用纯 Web Crypto）
##   - 路由用 endsWith 匹配，所以前端 baseUrl 带不带 /api/v1 前缀都行
##   - worker 入口必须 export default { fetch, scheduled }（module worker 格式，
##     wrangler 4.x 严格模式），否则报 10021 "No event handlers were registered"

name = "sullyos"
main = "worker/amsg/worker.bundle.js"
## compatibility_date 由 Cloudflare 仪表盘 remote 配置注入（2026-08-06）。
## 不在 wrangler.toml 写，避免跟仪表盘 drift warning。
## 仪表盘 deployment 里实际用的是 2026-08-06（仪表盘自动选今天的日期）。
compatibility_date = "2026-08-06"
compatibility_flags = []
workers_dev = true
preview_urls = true

## D1 数据库绑定
##   database_id 由 Cloudflare 仪表盘 Bindings → D1 database binding 同步过来
##   留空 = 让 wrangler 4.x 读仪表盘 remote binding；不写这字段避免 drift warning
##   如要手填：wrangler d1 create sully-amsg2
[[d1_databases]]
binding = "DB"
database_name = "sully-amsg2"

## Cron 触发器：每分钟扫一次到期任务
## 主动消息 2.0 支持 minute 级精度（比 1.0 的 30 分钟细一截）
[triggers]
crons = ["* * * * *"]

## Durable Object 绑定：INSTANT_TICK
##   - 作用：即时对话（POST /instant-chat 回完 202 后的「起跳器」——它接下来用 alarm() 跑
##     真正的 LLM 生成 + 推送回写，不占主请求生命周期；
##     see worker/amsg/src/instantChat.ts 的 kickInstantTick + worker/amsg/src/index.ts 的
##     InstantTickDO）
##   - 这条 binding 之前没在 wrangler.toml 声明，CF 没创建 InstantTickDO 实例，
##     env.INSTANT_TICK 永远 undefined → GET /config-check 的 instantTick=false，
##     前端 resolveInstantChatBlocker 永远判 Worker太旧 → 即时对话按钮置灰。
##
##   - 不能同时加 [[migrations]] 段：CF 上已经有 InstantTickDO 类（migration tag
##     "amsg-instant-tick-v1"，自更新路径之前已 apply 过），wrangler 4.x 看见新
##     new_sqlite_classes 会报 10074 "Cannot apply new-sqlite-class migration to
##     class that is already depended on by existing Durable Objects"。绑定的类
##     在 CF 上已经存在，只加 binding 不写 migration，CF 默认沿用现存的 namespace，
##     不会 recreate schema — 这是官方支持的迁移声明方式（见 wrangler 文档的
##     "skip migration if class exists"）。
[[durable_objects.bindings]]
name = "INSTANT_TICK"
class_name = "InstantTickDO"

## 非敏感环境变量（明文可放这里）。密钥类走 Secret。
##   - AMSG_SERVER_TOKEN：客户端鉴权 token（X-Client-Token header 传过来）
##     **变量名必须是 AMSG_SERVER_TOKEN（不是 SERVER_TOKEN）**——
##     Worker 代码读 env.AMSG_SERVER_TOKEN，wrangler.toml 写别的名字 env 读不到。
##     CF 不允许 vars 和 secret 同名（[code 10053]）——
##     AMSG_SERVER_TOKEN 只能在 wrangler secret put 通道写入，
##     wrangler.toml 留空字符串会占 binding 名、阻塞 secret put。
##   - CORS_ALLOWED_ORIGIN：跨域白名单。填具体 origin（推荐），
##     留空则按请求 origin 回显（开发模式）。
##
## MASTER_KEY / VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_EMAIL 走 Secret
[vars]
CORS_ALLOWED_ORIGIN = "https://sully-os-git-preview-muse0909s-projects.vercel.app"
