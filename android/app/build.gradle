apply plugin: 'com.android.application'
// 暮色 2026-08-26 角色查手机 P0：编译 Kotlin 插件
apply plugin: 'org.jetbrains.kotlin.android'

// 麦麦 2026-09-03：后台保活配置入口（统一从 gradle.properties / local.properties 读）
//   这些字段是 Android 端的「服务端地址」配置 — 跟前端 utils/proactivePushConfig.ts 的
//   import.meta.env.VITE_PROACTIVE_* 同源，名字对齐。
//
//   读取顺序（Gradle 优先级从低到高，高优先级覆盖低优先级）：
//     1. android/gradle.properties          → 占位符（提交到 git，作为兜底默认值）
//     2. android/local.properties           → 本机真值（gitignore，不提交）
//     3. 环境变量 KEEP_ALIVE_*              → CI 注入用
//     4. -P 启动参数 ./gradlew assembleDebug -PKEEP_ALIVE_WS_URL=...   → 临时覆盖
//
//   暮色正式配置走 local.properties 或环境变量。占位符保留作 fallback，
//   build 时 gradle 脚本会 warn 提示「使用占位符，主动消息无法工作」。
//
// 重要：project.findProperty() 只读 gradle.properties，**不**读 local.properties。
// local.properties 是 Android Studio 用来配 sdk.dir 的，不会自动喂给其他 property。
// 所以我们**显式**用 Properties 类把 local.properties 加载进来，作为额外数据源。
def localProps = new Properties()
// build.gradle 在 android/app/，local.properties 在 android/，所以 ../local.properties
def localPropsFile = file("../local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def readCfg = { String key, String fallback ->
    def fromLocal = localProps.getProperty(key)
    def fromProp = project.findProperty(key)
    def fromEnv = System.getenv(key)
    if (fromEnv != null && !fromEnv.isEmpty()) return fromEnv      // 1. 环境变量（最高）
    if (fromProp != null) return fromProp                          // 2. gradle.properties / -P 参数
    if (fromLocal != null) return fromLocal                        // 3. local.properties
    return fallback                                                // 4. 占位符兜底
}

// 麦麦 2026-10-03：测试包指向 fix 分支的网页部署，正式包继续指 master。
//
// ## 为什么需要这个
//
// capacitor.config.json 里写着 server.url，Capacitor 有它就会**从远程加载网页**，
// APK 里那份本地 assets 根本不参与。于是「打一个 fix 分支的包」拿到的还是 master 的
// 代码——2026-10-03 就在这上面栽了：暮色装上 67b8defc 测了半天，屏幕上跑的是 master。
// 五条独立证据都对上了（APK 内 config / git 历史 / 截图旧文案 / 远端 bundle 符号 /
// D1 数据），最后才定位到这里。
//
// ## 为什么放在 gradle 而不是手动改 assets
//
// android/app/src/main/assets/capacitor.config.json 是 `npx cap copy` 的产物，
// 而且**在 .gitignore 里**（android/.gitignore:99），从没提交过。手动改它有两个坏处：
// 一是 `npx cap sync` 每次都会用根目录那份覆盖回去（2026-10-03 那次就是这么丢的）；
// 二是没有任何记录，回头没人说得清当时指向的是哪个分支。
//
// 改成 build 时按 property 选：
//   ./gradlew assembleDebug -PtestBuild              → 用 capacitor.config.test.json
//   ./gradlew assembleDebug                          → 用 capacitor.config.json
// **两个方向都写**，所以不管上一次 build 留下了什么，每次都会纠正回正确的那份。
//
// ## 两份文件的差异只有 server.url 和 allowNavigation 多一行
//   capacitor.config.json        → https://sully-muse-vert.vercel.app（master，暮色手机在用）
//   capacitor.config.test.json   → https://sully-os-git-fix-amsg2-realign-...vercel.app（fix）
// 改其中一份时记得用 python 从另一份重新生成，别手抄整个文件。

def syncCapacitorConfig = tasks.register('syncCapacitorConfig') {
    def isTest = project.hasProperty('testBuild')
    def rootDir = rootProject.projectDir.parentFile
    def target = new File(project.projectDir, 'src/main/assets/capacitor.config.json')
    def source = new File(rootDir, isTest ? 'capacitor.config.test.json' : 'capacitor.config.json')
    inputs.file(source)
    outputs.file(target)
    doLast {
        if (!source.exists()) {
            throw new GradleException("找不到 ${source} —— 服务器地址配置读不到，拒绝构建")
        }
        target.parentFile.mkdirs()
        target.bytes = source.bytes
        def which = isTest ? '测试包' : '正式包'
        logger.lifecycle("[amsg] ${which} 的 capacitor.config 来自 ${source.name}（server.url 指向 ${which == '测试包' ? 'fix 分支' : 'master'}）")
    }
}

android {
    namespace "com.aetheros.simulator"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // 麦麦 2026-09-29：测试版并存支持。
        //   默认行为一个字都不变；带 -PtestBuild=true 打出来的包，包名后面多一段，
        //   手机上就能跟正式版同时存在（各自一份本地数据、各自一份推送订阅，
        //   因为用户身份是从本地数据读出来的，互不干扰）。
        applicationId "com.aetheros.simulator" + (project.hasProperty('testBuild') ? ".amsgtest" : "")
        //   2026-09-29 麦麦：测试版桌面上改个名字（暮色要求），否则两个图标一模一样分不清。
        //     名字在 resValue 里覆盖 strings.xml 的 app_name / title_activity_main。
        //     resValue 只对当前变体生效，资源优先级高于 res/values/strings.xml。
        //   -PtestAppName=xxx 可以临时换名字（暮色 9-29 打语音测试包时要求叫「语音测试」），
        //     不传就用下面这个默认值，所以不影响之前 amsg2 那套既有流程。
        //   麦麦 2026-10-03 更正：默认值原来写成 Solly（多一个 o）。项目里到处是 Sully
        //     ——index.html 的 title 就是 SullyOS、全仓 274 处 Sully 对 4 处 Solly，
        //     那 4 处全是这个名字自己写出来的。正式包名「拾光机」是 strings.xml 里的，
        //     不受这里影响。
        def testAppName = project.findProperty('testAppName') ?: "Sully"
        resValue "string", "app_name", (project.hasProperty('testBuild') ? testAppName : "拾光机")
        resValue "string", "title_activity_main", (project.hasProperty('testBuild') ? testAppName : "拾光机")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 暮色 2026-09-10：APK 自动版本号
        //   versionCode = Unix timestamp 秒数（从 1970 起）
        //   2026 年约 17.5 亿秒，远小于 Integer.MAX_VALUE (21 亿)
        //   每次 build 都唯一递增（秒级精度，同一秒内两次 build 相同但概率低）
        //   versionName = 日期 + 短 git commit hash（暮色手机能看到完整版本来源）
        //   例如 2026-09-10-6772f4b（看一眼就知道是 9-10 打的 6772f4b commit）
        versionCode ((System.currentTimeMillis() / 1000L) as int)
        def buildDate = new Date().format("yyyy-MM-dd")
        def gitHash = 'local'
        try {
            def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute()
            proc.waitFor()
            if (proc.exitValue() == 0) {
                gitHash = proc.text.trim()
            }
        } catch (Exception ignored) {}
        versionName "${buildDate}-${gitHash}" + (project.hasProperty('testBuild') ? "-test" : "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }

        // 麦麦 2026-09-03：后台保活 4 个 BuildConfig 字段
        //   - WS_URL：WebSocket 服务端地址（Cloudflare Worker）
        //   - WS_TOKEN：客户端鉴权 token（共享密钥，配 Worker CLIENT_TOKEN）
        //   - WS_VAPID_PUBLIC_KEY：VAPID 公钥（公开安全值，公开在源码里也行）
        //   - KEEP_ALIVE_LOG：诊断日志开关（true / false），生产关、调试开
        //
        // 占位符时 KeepAliveService 启动后会打 warn 日志，主动消息通道不工作。
        // 直接 inline localProps.getProperty()，不用 readCfg 闭包（闭包对 localProps
        // 引用行为在 defaultConfig 块内不可靠）
        buildConfigField "String", "WS_URL", "\"${localProps.getProperty('KEEP_ALIVE_WS_URL', 'wss://PLACEHOLDER_URL/ws/push')}\""
        buildConfigField "String", "WS_TOKEN", "\"${localProps.getProperty('KEEP_ALIVE_WS_TOKEN', 'PLACEHOLDER_TOKEN')}\""
        buildConfigField "String", "WS_VAPID_PUBLIC_KEY", "\"${localProps.getProperty('KEEP_ALIVE_VAPID_PUBLIC_KEY', '')}\""
        buildConfigField "boolean", "KEEP_ALIVE_LOG", "${localProps.getProperty('KEEP_ALIVE_LOG', 'false')}"
    }

    // 麦麦 2026-09-03：AGP 8.0+ 默认 buildConfig 关闭，要显式开
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // 暮色 2026-09-10：APK 文件名带版本号；2026-10-03 更正前缀为 sully
    //   xxxx = versionName（例如 2026-10-03-67b8defc）
    //   debug 包后缀加 -debug，release 包不加后缀
    //   为什么从「拾光机」改成 sully（暮色 10-03 原话「省得搞错了」）：
    //     文件名是给暮色看的，桌面上真正显示的是 app_name 那个「拾光机」。两个名字
    //     长得不一样，每次发包都要解释一遍哪个是哪个——「怎么还是拾光机，不是 sully
    //     吗」这句话 10-03 就说过一次。统一成 sully，文件名和包名对得上，也跟
    //     index.html 的 title（SullyOS）一致。
    //     正式包桌面名**不改**，仍是 strings.xml 里的「拾光机」——那是你自己在用的名字。
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def apkName = "sully-${versionName}"
            if (variant.buildType.name == 'debug') {
                apkName += '-debug'
            }
            apkName += '.apk'
            output.outputFileName = apkName
        }
    }

    // 麦麦 2026-10-03：把 server.url 的选择挂到 preBuild 上，保证「打包时读到的 config」
    //   一定是这次 build 该用的那份。用 dependsOn 而不是直接写在 assets 任务里，是因为
    //   mergeDebugAssets 跑在 preBuild 之后——顺序反了 assets 目录里就会留着上一份。
    preBuild.dependsOn syncCapacitorConfig
}

// 麦麦 2026-09-03：占位符 build-time 警告
//   在 build 配置阶段就提醒开发者「你还在用占位符，主动消息接不通」，
//   避免忘配 / 配错就过 build。worker 真值由暮色给之后会改 local.properties。
afterEvaluate {
    def wsUrl = readCfg('KEEP_ALIVE_WS_URL', 'wss://PLACEHOLDER_URL/ws/push')
    def wsToken = readCfg('KEEP_ALIVE_WS_TOKEN', 'PLACEHOLDER_TOKEN')
    if (wsUrl == 'wss://PLACEHOLDER_URL/ws/push' || wsToken == 'PLACEHOLDER_TOKEN') {
        logger.warn("================ KEEP ALIVE CONFIG WARNING ================")
        logger.warn("KEEP_ALIVE_WS_URL or KEEP_ALIVE_WS_TOKEN is still PLACEHOLDER.")
        logger.warn("Proactive message WebSocket channel will NOT work in this build.")
        logger.warn("Set real values in android/local.properties or via -P / env var.")
        logger.warn("===========================================================")
    } else {
        logger.lifecycle("KEEP_ALIVE_WS_URL = ${wsUrl}")
        logger.lifecycle("KEEP_ALIVE_LOG = ${readCfg('KEEP_ALIVE_LOG', 'false')}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // 暮色 2026-08-29 后台保活 P0 第二步：WebSocket 客户端
    //   KeepAliveService 里用 OkHttp WebSocket 跟 Cloudflare Worker 建立长连接
    //   4.12.0 是当前稳定版，minSdk 22 / Java 17 兼容
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // 麦麦 2026-09-15：拾光机 主动消息 2.0 后台推送 — UnifiedPush Android 桥接
    //   给 SullyOS fork 补的 AmsgUnifiedPushPlugin + UnifiedPushReceiver 用
    //   原版拾光机 fork 的原生壳保留在 CHICK2 私有仓库，不公开；
    //   这里用 UnifiedPush 官方 android-connector 3.0.0（JitPack 分发）。
    //   选 3.0.0 是因为它支持 INSTANCE_DEFAULT 常量和 tryUseCurrentOrDefaultDistributor 回调签名。
    implementation 'com.github.UnifiedPush:android-connector:3.0.0'
    // 暮色 2026-09-25 20:02：app 端 AmsgKeyManager 复用 SDK 的 RFC 8291 解密实现
    //   （com.google.crypto.tink.apps.webpush.WebPushHybridDecrypt）。SDK 用 implementation 引入，
    //   Tink 不在编译 classpath 里——显式声明让 Gradle 把传递依赖拉进来。
    implementation 'com.google.crypto.tink:apps-webpush:1.11.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
