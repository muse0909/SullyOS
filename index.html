


<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 麦麦 2026-09-06：APK WebView 缓存根治（暮色 9-6 反馈反复部署看不到效果）
         Vercel 已经返回 max-age=0, must-revalidate（强 revalidate），但 WebView 自己的 OkHttp HTTP cache
         不受 server header 控制，会缓存 HTML + 所有资源。这里加双保险 meta 阻止 HTML 缓存。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SullyOS</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SullyOS" />
    
    <!-- Updated Icons -->
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--app-font)', 'sans-serif'],
            },
            colors: {
              primary: 'hsl(var(--primary-hue), var(--primary-sat), var(--primary-lightness))', 
              'primary-focus': 'hsl(var(--primary-hue), var(--primary-sat), calc(var(--primary-lightness) - 10%))',
              'primary-light': 'hsl(var(--primary-hue), var(--primary-sat), 92%)',
              surface: 'rgba(255, 255, 255, 0.75)',
              'surface-glass': 'rgba(255, 255, 255, 0.35)',
            },
            animation: {
              'fade-in': 'fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1)',
              'slide-up': 'slideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'slide-down': 'slideDown 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'slide-in-right': 'slideInRight 0.32s cubic-bezier(0.25, 1, 0.5, 1)',
              'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'float-up': 'floatUp 3s ease-out forwards',
              'wiggle': 'wiggle 0.5s ease-in-out infinite',
              'bounce-slow': 'bounceSlow 2s ease-in-out infinite',
              'float': 'floatDrift 4s ease-in-out infinite alternate',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.97) translateY(4px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5)' },
                '60%': { transform: 'scale(1.05)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              floatUp: {
                '0%': { opacity: '1', transform: 'translateY(100vh) scale(1)' },
                '50%': { opacity: '1' },
                '100%': { opacity: '0', transform: 'translateY(-50px) scale(1.5)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'translate(-50%, -100%) rotate(-3deg)' },
                '50%': { transform: 'translate(-50%, -100%) rotate(3deg)' },
              },
              bounceSlow: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              floatDrift: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '0.3' },
                '100%': { transform: 'translateY(-30px) scale(1.1)', opacity: '0.6' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.15)' },
                '50%': { boxShadow: '0 0 25px rgba(139, 92, 246, 0.3)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary-hue: 245;
        --primary-sat: 25%;
        --primary-lightness: 65%;
        --safe-area-bottom: env(safe-area-inset-bottom);
        /* 安全区 + SullyOS 状态栏 — 全屏面板顶栏统一用这套
           静态 fallback：浏览器/非 iOS PWA 直接用 env() 值
           动态覆写：utils/iosStandalone.ts 在 iOS 全屏 PWA 下用 JS 探测值兜底
           （iOS env() 偶发返回 0 的已知 bug） */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --chrome-top: calc(env(safe-area-inset-top, 0px) + 2.5rem); /* 40px = SullyOS in-app 状态栏 */
        --app-height: 100lvh;
        --keyboard-inset: 0px;
        --app-font: 'Quicksand', sans-serif;
      }
      html, body, #root {
        width: 100%;
        min-height: var(--app-height, 100lvh);
        height: var(--app-height, 100lvh);
      }
      body {
        background-color: #ffffff;
        margin: 0;
        overflow: hidden;
        /* Critical: Prevent browser back/forward swipe navigation AND vertical rubber-banding */
        overscroll-behavior: none;
        /* Prevent text selection to feel like an app */
        user-select: none;
        -webkit-user-select: none;
        height: var(--app-height);
        min-height: var(--app-height);
        width: 100vw;
        font-family: var(--app-font);
      }
      body.ios-standalone {
        min-height: var(--app-height);
        height: var(--app-height);
        overscroll-behavior-y: auto;
        overscroll-behavior-x: none;
      }
      body.ios-standalone #root {
        min-height: var(--app-height);
        height: var(--app-height);
      }
      /* Global scroll behavior fix */
      .no-overscroll {
        overscroll-behavior: none;
      }
      .overscroll-contain {
        overscroll-behavior: contain;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
      }
      /* Utility for Safe Area */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* 暮色 2026-09-09：WebView loading 阶段全屏图盖在 root 上面
         跟 Android 系统 splash 不冲突：splash 提前 2s 消失（capacitor.config launchShowDuration），
         这层在 splash 消失后 → WebView 加载远程资源 + React 渲染完前 一直显示 */
      #sullyos-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        /* 暮色 2026-09-09 22:43 换图：背景色跟默认 loading 图底色一致
           暮色给的新图（NOCTURNE 浅蓝拱窗白天 1080x2376）底色是浅蓝
           用 #b8d4ec 浅蓝底色（图片加载前不闪黑） */
        background: #b8d4ec;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.5s ease-out;
      }
      #sullyos-loading img {
        /* 暮色 9-9 22:42：完整显示图（不裁剪），空余区域由 #b8d4ec 背景填充
           之前 cover 会放大裁掉四周，跟暮色要的"看到完整图"不符 */
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
      }
      #sullyos-loading.sullyos-loading-fade {
        opacity: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {

</head>
  <body>
    <!-- 暮色 2026-09-09 22:43：WebView loading 阶段显示的图
         流程：splash (1s) → 加载图 (强制 2s) → React 渲染完 → 淡出
         总时长 ≈ 3s（splash 1s + loading 2s）
         暮色 9-9 22:42 反馈 "开屏 1 秒，加载 2 秒然后跳桌面" -->
    <!-- 默认图是 public/loading-default.png（暮色 9-9 22:43 给的 NOCTURNE 浅蓝拱窗白天那张高分辨率版） -->
    <!-- 用户上传的图由 utils/loadingImage.ts 在 index.tsx 启动时读 localStorage 覆盖 src -->
    <div id="sullyos-loading" aria-hidden="true">
      <img id="sullyos-loading-img" src="./loading-default.png" alt="" />
    </div>
    <script>
      (function setupLoadingFadeOut() {
        // 暮色 9-9 22:42：loading 阶段固定显示 2 秒（不管 React 渲染完没完）
        //   React 渲染完会派发 sullyos:app-ready — 但我们要等 2 秒再看效果
        //   之前是 React 一渲染完就淡出，导致 loading 闪一下就没了
        function fadeOut() {
          var el = document.getElementById('sullyos-loading');
          if (!el) return;
          el.classList.add('sullyos-loading-fade');
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 600);
        }
        // 暮色 9-9 22:42 想要的开屏 1s + loading 2s = 3s 总时长
        // splash 阶段由 Android launchShowDuration 控制（1s）
        // loading 阶段固定显示 2 秒，从 DOMContentLoaded 起算（不依赖 React 渲染）
        var loadingStart = Date.now();
        var LOADING_MIN_MS = 2000;  // loading 最少显示 2 秒
        function maybeFadeOut() {
          var elapsed = Date.now() - loadingStart;
          if (elapsed >= LOADING_MIN_MS) {
            fadeOut();
          } else {
            setTimeout(fadeOut, LOADING_MIN_MS - elapsed);
          }
        }
        // 兜底：splash + loading + React 渲染超过 12s 强制淡出（防卡死白屏）
        var fallback = setTimeout(fadeOut, 12000);
        window.addEventListener('sullyos:app-ready', function () {
          // React 渲染完，但不立刻淡出 —— 等到至少 2 秒再淡出
          clearTimeout(fallback);
          maybeFadeOut();
        }, { once: true });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
